name: Deploy to Jino

on:
  push:
    branches: [main]
  workflow_dispatch:

# новый push отменяет предыдущий деплой, чтобы зависший запуск не держал очередь
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # секреты нельзя проверять в if напрямую, поэтому прокидываем через env
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      # проверка синтаксиса PHP-обработчиков (php есть в образе ubuntu-latest)
      - run: for f in public/api/*.php; do php -l "$f"; done
      - run: npm run build

      # Деплой по HTTPS: собранный сайт уходит одним подписанным запросом в
      # public/api/deploy.php на самом сайте. FTP и SFTP между GitHub и Jino
      # регулярно обрывались, а HTTPS до сайта доходит стабильно.
      - name: Upload to Jino
        if: env.DEPLOY_TOKEN != ''
        timeout-minutes: 5
        run: |
          python3 - <<'EOF'
          import base64, json, os
          files = {}
          for root, _, names in os.walk('dist'):
              for name in names:
                  path = os.path.join(root, name)
                  with open(path, 'rb') as f:
                      files[os.path.relpath(path, 'dist').replace(os.sep, '/')] = base64.b64encode(f.read()).decode()
          with open('deploy.json', 'w') as f:
              json.dump({'files': files}, f)
          print(f'Файлов в сборке: {len(files)}')
          EOF

          TS=$(date +%s)
          SIG=$( { printf '%s.' "$TS"; cat deploy.json; } | openssl dgst -sha256 -hmac "$DEPLOY_TOKEN" | sed 's/^.*= //')
          curl --fail-with-body -sS --retry 3 --retry-all-errors --retry-delay 5 --max-time 60             -X POST https://ohotnik-oz.ru/api/deploy.php             -H 'Content-Type: application/json'             -H "X-Deploy-Timestamp: $TS"             -H "X-Deploy-Signature: $SIG"             --data-binary @deploy.json
          echo

      - name: Skip upload
        if: env.DEPLOY_TOKEN == ''
        run: echo "::notice::Секрет DEPLOY_TOKEN не задан — сайт собран, но не загружен на хостинг"

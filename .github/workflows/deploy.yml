name: Deploy to Jino

on:
  push:
    branches: [main]
  workflow_dispatch:

# новый push отменяет предыдущий деплой, чтобы зависший запуск не держал очередь
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # секреты нельзя проверять в if напрямую, поэтому прокидываем через env
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      # проверка синтаксиса PHP-обработчиков (php есть в образе ubuntu-latest)
      - run: for f in public/api/*.php; do php -l "$f"; done
      - run: npm run build

      # Загрузка по SFTP (порт 2222): одно зашифрованное соединение без отдельных
      # data-портов, как у FTP — они между GitHub и Jino регулярно обрывались.
      # После загрузки явно выставляем папкам 755, иначе Jino отдаёт 403.
      - name: Upload to Jino
        if: env.FTP_PASSWORD != ''
        timeout-minutes: 8
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          # ключи SFTP-сервера Jino (ssh-keyscan -p 2222) — соединение проверяется,
          # подменить сервер не получится
          JINO_HOST_KEYS: |
            [c825fa2a9b46.hosting.myjino.ru]:2222 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBLuwsI8BPoCJtGTr7Kkp9jkzgP5T2sG8sJviodLk3Glxgn4g4x6oZ7YKWEDmdRqW955iLGomP9xykgp19YUCcNY=
            [c825fa2a9b46.hosting.myjino.ru]:2222 ssh-rsa 
        run: |
          sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq lftp > /dev/null
          mkdir -p ~/.ssh && echo "$JINO_HOST_KEYS" > ~/.ssh/known_hosts_jino

          upload() {
            lftp <<EOF
          set cmd:fail-exit yes
          set net:timeout 30
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set sftp:connect-program "ssh -a -x -o UserKnownHostsFile=$HOME/.ssh/known_hosts_jino -o StrictHostKeyChecking=yes"
          open -u "$FTP_USERNAME","$FTP_PASSWORD" sftp://$FTP_SERVER:2222
          mirror -R --verbose --parallel=2 dist/ "$FTP_SERVER_DIR"
          cd "$FTP_SERVER_DIR"
          chmod 755 assets images api
          bye
          EOF
          }

          for attempt in 1 2 3; do
            if upload; then
              echo "Загружено с попытки $attempt"
              exit 0
            fi
            echo "::warning::Попытка $attempt не удалась, повтор через 10 секунд"
            sleep 10
          done
          echo "::error::Не удалось загрузить сайт на Jino за три попытки"
          exit 1

      - name: Skip upload
        if: env.FTP_PASSWORD == ''
        run: echo "::notice::Секреты FTP не заданы — сайт собран, но не загружен на хостинг"

name: Deploy to Jino

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # секреты нельзя проверять в if напрямую, поэтому прокидываем через env
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # lftp, а не готовый FTP-экшен: Jino создаёт папки без прав на чтение
      # для веб-сервера (403 на assets/ и images/), поэтому после загрузки
      # явно выставляем им 755
      - name: Upload to Jino
        if: env.FTP_PASSWORD != ''
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p 21 "$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set net:max-retries 2
          mirror -R --verbose --parallel=4 dist/ "$FTP_SERVER_DIR"
          cd "$FTP_SERVER_DIR"
          chmod 755 assets images
          bye
          EOF

      - name: Skip upload
        if: env.FTP_PASSWORD == ''
        run: echo "::notice::Секреты FTP не заданы — сайт собран, но не загружен на хостинг"

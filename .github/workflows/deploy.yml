name: Deploy to Jino

on:
  push:
    branches: [main]
  workflow_dispatch:

# новый push отменяет предыдущий деплой, чтобы зависший запуск не держал очередь
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # секреты нельзя проверять в if напрямую, поэтому прокидываем через env
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # lftp вместо готового FTP-экшена: после загрузки явно выставляем папкам 755,
      # иначе веб-сервер Jino отдаёт 403 на assets/ и images/
      - name: Upload to Jino
        if: env.FTP_PASSWORD != ''
        timeout-minutes: 10
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq lftp > /dev/null

          upload() {
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p 21 "$FTP_SERVER" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 20
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 15
          mirror -R --verbose --parallel=2 dist/ "$FTP_SERVER_DIR"
          cd "$FTP_SERVER_DIR"
          chmod 755 assets images
          bye
          EOF
          }

          # FTP между GitHub и Jino иногда обрывается — пробуем до трёх раз
          for attempt in 1 2 3; do
            if upload; then
              echo "Загружено с попытки $attempt"
              exit 0
            fi
            echo "::warning::Попытка $attempt не удалась, повтор через 15 секунд"
            sleep 15
          done
          echo "::error::Не удалось загрузить сайт на Jino за три попытки"
          exit 1

      - name: Skip upload
        if: env.FTP_PASSWORD == ''
        run: echo "::notice::Секреты FTP не заданы — сайт собран, но не загружен на хостинг"
